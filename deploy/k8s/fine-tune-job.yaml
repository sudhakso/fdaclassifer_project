# FDA 483 encoder fine-tune. Same GKE shape as the Gemma4 trainer:
# namespace ml-workloads, L4 pool, Workload Identity SA, GCS FUSE PVC.
# The trainer only uses filesystem paths under the mount.
#
# Expected bucket layout (PVC ml-object-store):
#   gs://bucket/dataset/v1/fda_labelled_sample.json -> /gcs-mount/dataset/v1/fda_labelled_sample.json
#   gs://bucket/registry/model-v1/                 -> /gcs-mount/registry/model-v1/
#
# Submit:
#   export RUN_ID=fda-$(date +%Y%m%d-%H%M%S)
#   export TRAINER_IMAGE=your-registry/litewave-fda-trainer:TAG
#   envsubst < deploy/k8s/fine-tune-job.yaml | kubectl apply -f -
#   kubectl logs -f job/fda-train-${RUN_ID} -n ml-workloads
apiVersion: batch/v1
kind: Job
metadata:
  namespace: ml-workloads
  name: fda-train-${RUN_ID}
  labels:
    app: fda-trainer
    run_id: "${RUN_ID}"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: fda-trainer
        run_id: "${RUN_ID}"
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vijeta-finetuning-workload-sa
      containers:
        - name: trainer
          image: ${TRAINER_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - --fda-data-path=/gcs-mount/dataset/v1/fda_labelled_sample.json
            - --output-gcs-uri=/gcs-mount/registry/model-v1/
            - --base-model=microsoft/deberta-v3-base
            - --epochs=4
            - --batch-size=16
            - --learning-rate=2e-5
          env:
            - name: RUN_ID
              value: "${RUN_ID}"
            - name: MOUNT_ROOT
              value: /gcs-mount
            - name: HF_HOME
              value: /cache/huggingface
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: ml-store
              mountPath: /gcs-mount
            - name: hf-cache
              mountPath: /cache/huggingface
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: ml-store
          persistentVolumeClaim:
            claimName: ml-object-store-fda-classifier
        - name: hf-cache
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
