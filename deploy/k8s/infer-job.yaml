# Score FDA 483 observations with the trained encoder.
# Same GKE shape as the fine-tune Job: namespace ml-workloads, L4 pool,
# Workload Identity SA, GCS FUSE PVC. Paths are on the mount.
#
# Expected bucket layout (PVC ml-object-store):
#   gs://bucket/registry/${MODEL_RUN_ID}/              -> /gcs-mount/registry/${MODEL_RUN_ID}/
#   gs://bucket/${INPUT_PATH}                          -> /gcs-mount/${INPUT_PATH}
#   gs://bucket/evaluation/predictions-${RUN_ID}.json  written by this Job
#
# Submit:
#   export RUN_ID=fda-$(date +%Y%m%d-%H%M%S)
#   export MODEL_RUN_ID=<RUN_ID of the training job>
#   export INPUT_PATH=dataset/v2/flash/test.json
#   export TRAINER_IMAGE=your-registry/litewave-fda-trainer:TAG
#   envsubst < deploy/k8s/infer-job.yaml | kubectl apply -f -
#   kubectl logs -f job/fda-infer-${RUN_ID} -n ml-workloads
apiVersion: batch/v1
kind: Job
metadata:
  namespace: ml-workloads
  name: fda-infer-${RUN_ID}
  labels:
    app: fda-infer
    run_id: "${RUN_ID}"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: fda-infer
        run_id: "${RUN_ID}"
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vijeta-finetuning-workload-sa
      containers:
        - name: infer
          image: ${TRAINER_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "fda_classifier.infer"]
          args:
            - --model-dir=/gcs-mount/registry/${MODEL_RUN_ID}
            - --input=/gcs-mount/${INPUT_PATH}
            - --output=/gcs-mount/evaluation/predictions-${RUN_ID}.json
            - --batch-size=16
          env:
            - name: RUN_ID
              value: "${RUN_ID}"
            - name: MOUNT_ROOT
              value: /gcs-mount
            - name: HF_HOME
              value: /cache/huggingface
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: ml-store
              mountPath: /gcs-mount
            - name: hf-cache
              mountPath: /cache/huggingface
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: ml-store
          persistentVolumeClaim:
            claimName: ml-object-store-fda-classifier
        - name: hf-cache
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
